name: RDP via Tailscale with Arch Linux WSL

on:
  workflow_dispatch

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Install Tailscale
        run: |
          choco install tailscale -y

      - name: Connect to Tailscale
        run: |
          $env:TS_KEY = "${{ secrets.TS_KEY }}"
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=$env:TS_KEY --unattended
          echo "Tailscale connected successfully!"

      - name: Install WSL and Arch Linux
        shell: powershell
        run: |
          echo "Installing ArchWSL..."
          Invoke-WebRequest -Uri "https://github.com/yuk7/ArchWSL/releases/latest/download/Arch.zip" -OutFile "Arch.zip"
          Expand-Archive -Path "Arch.zip" -DestinationPath "C:\ArchWSL"
          
          cd C:\ArchWSL
          # تشغيل التثبيت التلقائي دون خيارات ملغاة
          .\Arch.exe --non-interactive

          echo "Updating Pacman Keys and Installing Java..."
          wsl -d Arch -- pacman-key --init
          wsl -d Arch -- pacman-key --populate archlinux
          wsl -d Arch -- pacman -Sy --noconfirm jdk17-openjdk wget unzip

          echo "Arch Linux with Java installed successfully!"

      - name: Configuring Remote Desktop for Windows
        run: |
          echo "Setting password for runneradmin..."
          net user runneradmin "P@ssword123456"
          
          echo "Configuring registry and firewall..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          echo "RDP protocol enabled successfully."

      - name: Maintaining Connection
        run: |
          echo "=================================================="
          echo "Server is Live!"
          echo "Username: runneradmin"
          echo "Password: P@ssword123456"
          echo "Tailscale IP:"
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          echo "=================================================="
          while ($true) {
              echo "Keep-alive: $(Get-Date)"
              Start-Sleep -Seconds 300
          }
